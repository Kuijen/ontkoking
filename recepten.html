<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Recepten – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/pages/recepten.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Naar de inhoud</a>
  <header id="site-header" class="site-header"></header>

  <section class="page-hero">
    <div class="page-hero-inner">
      <h1>Recepten</h1>
      <p>Zoek, filter en sorteer alle gepubliceerde recepten.</p>
    </div>
  </section>

  <main id="main" class="container">
    <div class="layout-sidebar">
      <aside aria-label="Filters">
        <details class="card filters" id="filters">
          <summary>Filters</summary>
          <form id="filterForm" class="filters-body">
            <div class="field field-flush">
              <label for="searchInput">Zoeken</label>
              <input type="search" id="searchInput" name="q" class="input" placeholder="Titel of ingrediënt" autocomplete="off">
            </div>

            <fieldset>
              <legend>Type gerecht</legend>
              <label class="check"><input type="checkbox" name="category" value="Vega"> Vega</label>
              <label class="check"><input type="checkbox" name="category" value="Vlees"> Vlees</label>
              <label class="check"><input type="checkbox" name="category" value="Vis"> Vis</label>
              <label class="check"><input type="checkbox" name="category" value="Soep"> Soep</label>
              <label class="check"><input type="checkbox" name="category" value="Dessert"> Dessert</label>
            </fieldset>

            <div>
              <label class="field-label" for="maxMinutes">Bereidingstijd</label>
              <input type="range" id="maxMinutes" name="maxMinutes" min="5" max="120" step="5" value="120">
              <div class="range-labels"><span>5 min</span><output id="maxMinutesOutput" for="maxMinutes">Alle tijden</output></div>
            </div>

            <fieldset>
              <legend>Dieet</legend>
              <label class="check"><input type="checkbox" name="diet" value="glutenvrij"> Glutenvrij</label>
              <label class="check"><input type="checkbox" name="diet" value="lactosevrij"> Lactosevrij</label>
              <label class="check"><input type="checkbox" name="diet" value="vegan"> Vegan</label>
            </fieldset>

            <div class="field field-flush">
              <label for="sortSelect">Sorteren op</label>
              <select id="sortSelect" name="sort" class="input">
                <option value="">Standaard</option>
                <option value="rating">Beoordeling</option>
                <option value="time">Bereidingstijd</option>
                <option value="newest">Nieuwste eerst</option>
              </select>
            </div>

            <button type="reset" class="btn btn-outline btn-block">Filters wissen</button>
          </form>
        </details>
      </aside>

      <section aria-labelledby="resultsTitle">
        <div class="results-head">
          <h2 id="resultsTitle" class="visually-hidden">Zoekresultaten</h2>
          <p id="resultCount" class="muted" aria-live="polite"></p>
          <div id="activeFilters" class="active-filters"></div>
        </div>
        <div class="grid" id="recipeGrid"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
