<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Beheer – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/pages/admin.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Naar de inhoud</a>
  <header id="site-header" class="site-header"></header>

  <section class="page-hero">
    <div class="page-hero-inner">
      <h1>Beheer</h1>
      <p>Gebruikers, recepten en de review-wachtrij.</p>
    </div>
  </section>

  <main id="main" class="container">
    <div id="noAccess" hidden>
      <div class="empty-state">
        <span class="empty-icon" aria-hidden="true">🚫</span>
        <h3>Geen toegang</h3>
        <p>Je hebt geen adminrechten voor deze pagina.</p>
        <a href="login.html?from=admin.html" class="btn btn-primary">Inloggen als admin</a>
      </div>
    </div>

    <div id="adminContent" class="admin-grid" hidden>
      <div>
        <section class="section" aria-labelledby="usersTitle">
          <div class="section-heading"><h2 id="usersTitle">Gebruikers</h2></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th scope="col">Gebruiker</th><th scope="col">Rol</th><th scope="col">Acties</th></tr></thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </section>

        <section class="section" aria-labelledby="contentTitle">
          <div class="section-heading"><h2 id="contentTitle">Recepten</h2></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th scope="col">Recept</th><th scope="col">Auteur</th><th scope="col">Status</th><th scope="col">Acties</th></tr></thead>
              <tbody id="contentBody"></tbody>
            </table>
          </div>
        </section>
      </div>

      <aside aria-labelledby="queueTitle">
        <div class="section-heading"><h2 id="queueTitle">Review-wachtrij</h2></div>
        <div class="stats" id="queueStats"></div>
        <a href="nieuw-recept.html" class="btn btn-primary btn-block">Nieuw recept</a>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
