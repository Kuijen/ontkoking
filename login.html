<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Inloggen – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
<main class="login-page">
  <div class="login-box login-box-wide">
    <header class="login-logo"><h1>GLR <span>Food Freaks</span></h1><p>Stop de ontkoking</p></header>
    <div class="auth-grid">
      <section class="card" aria-labelledby="loginTitle">
        <form class="login-form" action="index.html">
          <h2 id="loginTitle">Inloggen</h2>
          <div class="field"><label for="username">Gebruikersnaam</label><input type="text" id="username" class="input" placeholder="jouwgebruikersnaam" autocomplete="username"></div>
          <div class="field"><label for="password">Wachtwoord</label><input type="password" id="password" class="input" placeholder="••••••••" autocomplete="current-password"></div>
          <button class="btn btn-primary btn-block" type="submit">Inloggen</button>
        </form>
      </section>
      <section class="card" aria-labelledby="registerTitle">
        <form class="login-form" action="index.html">
          <h2 id="registerTitle">Account aanmaken</h2>
          <div class="field"><label for="newUsername">Gebruikersnaam</label><input type="text" id="newUsername" class="input" placeholder="Kies een gebruikersnaam" autocomplete="username"></div>
          <div class="field"><label for="newPassword">Wachtwoord</label><input type="password" id="newPassword" class="input" placeholder="Minimaal 6 tekens" autocomplete="new-password"></div>
          <div class="field"><label for="confirm">Bevestig wachtwoord</label><input type="password" id="confirm" class="input" placeholder="Herhaal je wachtwoord" autocomplete="new-password"></div>
          <button class="btn btn-outline btn-block" type="submit">Account aanmaken</button>
        </form>
      </section>
    </div>
  </div>
</main>

</body>
</html>
