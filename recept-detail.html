<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recept Detail – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="page-header">
    <div class="page-header-inner">
      <button class="back-btn" onclick="history.back()">← Terug</button>
      <h1 id="pageTitle">Recept Detail</h1>
    </div>
  </div>
  <div class="page-sub"><div class="page-sub-inner">Food Freaks | Recept Detail</div></div>

  <div class="container">
    <div id="notFound" style="display:none" class="no-access">
      <div class="icon">🍽️</div>
      <h2>Recept niet gevonden</h2>
      <p>Dit recept bestaat niet (meer).</p>
      <a href="recepten.html" class="btn btn-primary" style="margin-top:1rem">Terug naar recepten</a>
    </div>

    <div id="detailContent" style="display:grid;grid-template-columns:1fr 2fr;gap:2rem">
      <!-- Left -->
      <div>
        <img id="recipeImg" src="https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=500&h=360&fit=crop&auto=format"
          alt="Recept foto" style="width:100%;height:240px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:1rem">
        <div id="recipeMeta" style="display:flex;gap:1rem;font-size:.8rem;color:var(--muted-fg);margin-bottom:1rem;flex-wrap:wrap"></div>
        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem">
          <div class="avatar" id="authorAvatar">A</div>
          <div>
            <div id="authorName" style="font-size:.8rem;font-weight:600"></div>
            <div style="font-size:.72rem;color:var(--muted-fg)">Auteur</div>
          </div>
        </div>
        <button id="favBtn" class="btn btn-primary btn-full" onclick="toggleFav()">Sla op in Favorieten</button>
      </div>

      <!-- Right -->
      <div>
        <h1 id="recipeTitle" style="font-family:var(--display);font-size:2rem;font-weight:700;margin-bottom:.3rem"></h1>
        <div id="recipeStars" class="stars" style="font-size:1rem;margin-bottom:1.5rem"></div>

        <h3 style="font-weight:600;margin-bottom:.75rem">Ingrediënten</h3>
        <div id="ingredientsGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:.2rem .5rem;margin-bottom:1.5rem"></div>

        <h3 style="font-weight:600;margin-bottom:.75rem">Bereidingsstappen</h3>
        <div class="steps" id="stepBtns"></div>
        <div class="card" style="padding:1rem;margin-bottom:1.5rem;background:var(--muted)">
          <p id="stepTitle" style="font-weight:600;font-size:.85rem;margin-bottom:.4rem"></p>
          <p id="stepText" style="font-size:.85rem;color:var(--muted-fg);line-height:1.6"></p>
        </div>

        <h3 style="font-weight:600;margin-bottom:.75rem">Community Reacties</h3>
        <div id="commentsList" style="margin-bottom:1rem"></div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <div class="avatar">J</div>
          <input type="text" id="commentInput" class="form-control" placeholder="Schrijf een reactie..." style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="postComment()">Stuur</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data.js"></script>
  <script>
    renderNav('recepten.html');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let recept = getRecept(id);
    let activeStep = 0;

    if (!recept) {
      document.getElementById('notFound').style.display = 'block';
      document.getElementById('detailContent').style.display = 'none';
    } else {
      init();
    }

    function init() {
      document.getElementById('pageTitle').textContent = 'Recept Detail | ' + recept.title;
      document.getElementById('recipeTitle').textContent = recept.title;
      document.getElementById('recipeStars').textContent = stars(recept.rating);
      document.getElementById('authorName').textContent = recept.author;
      document.getElementById('authorAvatar').textContent = recept.author[0].toUpperCase();
      document.getElementById('recipeMeta').innerHTML = `<span>⏱ ${recept.time}</span><span>🍽️ ${recept.cat}</span>`;

      // Ingredients
      const ing = document.getElementById('ingredientsGrid');
      ing.innerHTML = (recept.ingredients || []).map(i => `
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--primary)"> ${i}
        </label>
      `).join('');

      // Steps
      renderSteps();

      // Fav button
      const favs = getFavorieten();
      if (favs.includes(parseInt(id))) {
        document.getElementById('favBtn').textContent = '✓ Opgeslagen';
        document.getElementById('favBtn').classList.replace('btn-primary', 'btn-accent');
      }

      // Comments
      renderComments();
    }

    function renderSteps() {
      const steps = recept.steps || [];
      const btns = document.getElementById('stepBtns');
      btns.innerHTML = steps.map((_, i) => `
        <button class="step-btn ${i === activeStep ? 'active' : ''}" onclick="setStep(${i})">${i + 1}</button>
      `).join('');
      document.getElementById('stepTitle').textContent = 'Stap ' + (activeStep + 1);
      document.getElementById('stepText').textContent = steps[activeStep] || '';
    }

    function setStep(i) {
      activeStep = i;
      renderSteps();
    }

    function toggleFav() {
      if (!recept) return;
      const added = toggleFavoriet(parseInt(id));
      const btn = document.getElementById('favBtn');
      if (added) {
        btn.textContent = '✓ Opgeslagen';
        btn.classList.replace('btn-primary', 'btn-accent');
      } else {
        btn.textContent = 'Sla op in Favorieten';
        btn.classList.replace('btn-accent', 'btn-primary');
      }
    }

    function renderComments() {
      const list = document.getElementById('commentsList');
      list.innerHTML = (recept.comments || []).map(c => `
        <div class="comment-item">
          <div class="avatar">${c.user[0].toUpperCase()}</div>
          <div>
            <div class="comment-name">${c.user}</div>
            <div class="comment-text">${c.text}</div>
          </div>
        </div>
      `).join('') || '<p style="font-size:.8rem;color:var(--muted-fg)">Nog geen reacties.</p>';
    }

    function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;
      const user = getSession();
      const name = user ? user.username : 'Gast';
      if (!recept.comments) recept.comments = [];
      recept.comments.push({ user: name, text });
      saveRecept(recept);
      input.value = '';
      renderComments();
    }
  </script>
</body>
</html>
