<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <h1>GLR <span>Food Freaks</span></h1>
        <p>Stop de "ontkoking"</p>
      </div>

      <div class="card">
        <div class="login-tabs">
          <button class="login-tab active" id="tabLogin" onclick="switchMode('login')">Inloggen</button>
          <button class="login-tab" id="tabRegister" onclick="switchMode('register')">Account aanmaken</button>
        </div>
        <div class="login-form-body">
          <div id="errorMsg" class="error-msg" style="display:none"></div>

          <div class="form-group">
            <label>Gebruikersnaam</label>
            <input type="text" id="username" class="form-control" placeholder="jouwgebruikersnaam" autocomplete="username">
          </div>
          <div class="form-group">
            <label>Wachtwoord</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="form-group" id="confirmGroup" style="display:none">
            <label>Bevestig wachtwoord</label>
            <input type="password" id="confirm" class="form-control" placeholder="••••••••" autocomplete="new-password">
          </div>

          <button class="btn btn-primary btn-full" id="submitBtn" onclick="handleSubmit()">Inloggen</button>
        </div>
      </div>

      <p style="text-align:center;font-size:.78rem;color:var(--muted-fg);margin-top:1rem" id="switchHint">
        Nog geen account?
        <a href="#" onclick="switchMode('register');return false" style="color:var(--primary);font-weight:500">Maak er een aan</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('from') || 'index.html';

    // Already logged in
    if (getSession()) window.location.href = redirectTo;

    let mode = 'login';

    function switchMode(m) {
      mode = m;
      document.getElementById('tabLogin').classList.toggle('active', m === 'login');
      document.getElementById('tabRegister').classList.toggle('active', m === 'register');
      document.getElementById('confirmGroup').style.display = m === 'register' ? '' : 'none';
      document.getElementById('submitBtn').textContent = m === 'login' ? 'Inloggen' : 'Account aanmaken';
      document.getElementById('switchHint').style.display = m === 'login' ? '' : 'none';
      document.getElementById('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      showError('');
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function handleSubmit() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (mode === 'login') {
        const result = login(username, password);
        if (result.ok) window.location.href = redirectTo;
        else showError(result.error);
      } else {
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) { showError('Wachtwoorden komen niet overeen.'); return; }
        const result = register(username, password);
        if (result.ok) window.location.href = 'index.html';
        else showError(result.error);
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
  </script>
</body>
</html>
