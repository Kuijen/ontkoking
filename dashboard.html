<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Keuken – Food Freaks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="page-header">
    <div class="page-header-inner">
      <h1>Mijn Recepten Dashboard</h1>
    </div>
  </div>
  <div class="page-sub"><div class="page-sub-inner">Mijn Keuken | Food Freaks</div></div>

  <div class="container">
    <div class="dash-grid">
      <!-- Left -->
      <div>
        <div class="section-heading" style="margin-bottom:.75rem">
          <h2>Mijn Favorieten</h2>
        </div>
        <div class="grid-2" id="favsGrid" style="margin-bottom:2rem"></div>

        <div class="section-heading" style="margin-bottom:.75rem">
          <h2>Mijn Toegevoegde Recepten</h2>
        </div>
        <div class="table-wrap" id="mijnTabel"></div>
        <a href="nieuw-recept.html" class="btn btn-outline btn-full" style="margin-top:.75rem">Bewerk Recept</a>
      </div>

      <!-- Right -->
      <div>
        <div class="section-heading" style="margin-bottom:.75rem">
          <h2>Overzicht Recepten</h2>
        </div>
        <div class="table-wrap" id="toegevoegdTabel" style="margin-bottom:2rem"></div>
        <a href="nieuw-recept.html" class="btn btn-primary btn-full" style="margin-bottom:2rem">+ Nieuw Recept (CRUD)</a>

        <div class="section-heading" style="margin-bottom:.75rem">
          <h2>Community Uploads</h2>
        </div>
        <div class="card card-body" id="communityUploads">
          <p style="font-size:.75rem;color:var(--muted-fg);margin-bottom:.75rem">Community Uploads: overzicht</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data.js"></script>
  <script>
    renderNav('dashboard.html');
    const user = getSession();

    function renderFavs() {
      const favIds = getFavorieten();
      const all = getRecepten();
      const favs = all.filter(r => favIds.includes(r.id));
      const grid = document.getElementById('favsGrid');
      if (!favs.length) {
        grid.innerHTML = '<p style="font-size:.8rem;color:var(--muted-fg);grid-column:1/-1">Nog geen favorieten. Sla recepten op via de detailpagina.</p>';
        return;
      }
      grid.innerHTML = favs.map(r => `
        <div class="card recipe-card" onclick="window.location.href='recept-detail.html?id=${r.id}'">
          <div class="recipe-thumb" style="height:90px;font-size:1.8rem">🍽️</div>
          <div class="recipe-info">
            <div class="recipe-title">${r.title}</div>
            <div class="stars">${stars(r.rating)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderMijnRecepten() {
      const all = getRecepten();
      const mijn = user ? all.filter(r => r.author === user.username) : [];
      const el = document.getElementById('mijnTabel');
      el.innerHTML = `<table>
        <thead><tr><th>Titel</th><th>Status</th><th>Actie</th></tr></thead>
        <tbody>
          ${mijn.length
            ? mijn.map(r => `<tr>
                <td>${r.title}</td>
                <td><span class="badge ${r.status === 'Gepubliceerd' ? 'badge-green' : 'badge-gray'}">${r.status}</span></td>
                <td><a href="recept-detail.html?id=${r.id}" class="btn btn-outline btn-sm">Bekijk</a></td>
              </tr>`).join('')
            : '<tr><td colspan="3" style="color:var(--muted-fg);font-size:.8rem">Nog geen recepten toegevoegd.</td></tr>'
          }
        </tbody>
      </table>`;
    }

    function renderToegevoegeRecepten() {
      const all = getRecepten();
      const el = document.getElementById('toegevoegdTabel');
      el.innerHTML = `<table>
        <thead><tr><th>Titel</th><th>Auteur</th><th>Status</th></tr></thead>
        <tbody>
          ${all.slice(0, 5).map(r => `<tr>
            <td>${r.title}</td>
            <td>${r.author}</td>
            <td><span class="badge ${r.status === 'Gepubliceerd' ? 'badge-green' : 'badge-gray'}">${r.status}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    function renderCommunity() {
      const all = getRecepten().filter(r => r.status === 'Concept').slice(0, 4);
      const el = document.getElementById('communityUploads');
      el.innerHTML = '<p style="font-size:.75rem;color:var(--muted-fg);margin-bottom:.75rem">Community Uploads: overzicht</p>'
        + (all.length
          ? all.map(r => `<div style="display:flex;justify-content:space-between;font-size:.8rem;padding:.35rem 0;border-bottom:1px solid var(--border)">
              <span>${r.title}</span>
              <span class="badge badge-gray">${r.status}</span>
            </div>`).join('')
          : '<p style="font-size:.8rem;color:var(--muted-fg)">Geen nieuwe uploads.</p>');
    }

    renderFavs();
    renderMijnRecepten();
    renderToegevoegeRecepten();
    renderCommunity();
  </script>
</body>
</html>
